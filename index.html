        <style>
            /* 全てのリセットと高さの確保 */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                /* 万が一の時の背景色 */
            }

            /* 1. ファーストビュー：背面固定 */
            #first-view {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 1;
                /* z-indexをプラスにして最背面に配置 */
            }


            /* 2. 下のセクション：上に被さるレイヤー */
            #second-section {
                position: relative;
                z-index: 2;
                /* ファーストビュー（1）より上に重ねる */

                /* ファーストビューの高さ分、最初から下に下げる */
                margin-top: 370vh;
                height: 300vh;




                width: 100%;
                min-height: 100vh;
                padding: 100px 20px;
            }

            #second-section h2 {
                font-size: 2rem;
                margin-bottom: 20px;
            }
        </style>
        </head>
